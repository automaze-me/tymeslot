# Tymeslot on Dokploy — application plus its own PostgreSQL.
#
# A fork-only file (automaze-me/tymeslot); not upstream. See README-Dokploy.md.
#
# Deploy as a Dokploy **Compose** service with Compose Path
# `docker-compose.dokploy.yml`, then set the variables below on the
# Environment tab.
#
# Only five variables have to be supplied; everything else is derived here:
#
#   PHX_HOST              booking.example.com       (no scheme, no trailing slash)
#   SECRET_KEY_BASE       openssl rand -base64 64 | tr -d '\n'
#   DATA_ENCRYPTION_KEY   openssl rand -base64 48 | tr -d '\n'
#   POSTGRES_PASSWORD     openssl rand -hex 32
#   SMTP_HOST             smtp.example.com
#
# Plus, in practice, EMAIL_FROM_ADDRESS and your SMTP credentials — see the
# comments on each below.
#
# Use `openssl rand -hex 32` for POSTGRES_PASSWORD specifically. It is
# interpolated into DATABASE_URL below, and hex is URL-safe by construction;
# a base64 password can contain `/` or `+`, which corrupt a connection URL.
# If you must use a password containing URL-special characters, delete the
# DATABASE_URL line and uncomment the discrete block beneath it, which needs
# no escaping.
#
# DATA_ENCRYPTION_KEY must stay stable for the life of the deployment. It
# encrypts stored calendar credentials; losing it makes them permanently
# undecryptable. Back it up alongside the database, not with your config.

services:
  tymeslot:
    build:
      context: .
      dockerfile: Dockerfile.docker
      # The slim target carries no PostgreSQL server. Omit this and you get the
      # default `release` target, which starts an embedded database alongside
      # the one below — two databases, one silently ignored.
      target: release-slim
    restart: unless-stopped

    # `expose`, never `ports`: Traefik reaches the container over
    # dokploy-network, and publishing to the host would bypass it.
    expose:
      - "4000"

    # ---------------------------------------------------------------------
    # How variables reach the container
    #
    # Two mechanisms, deliberately both.
    #
    # 1. The `environment` list below. `KEY=value` sets a value here; a bare
    #    `KEY` passes through whatever Dokploy supplied to Compose. **This list
    #    is the gate.** A variable you set on Dokploy's Environment tab that is
    #    not named here interpolates nowhere and never reaches the container —
    #    the single most common way a Compose deployment silently ignores its
    #    configuration.
    #
    #    A bare key whose variable is unset is omitted from the container
    #    environment entirely, rather than being set to an empty string. That
    #    distinction matters here: "" is truthy in Elixir, so an empty value
    #    would sail past every `System.get_env(...) || raise` check in the app
    #    and misconfigure it silently instead of failing loudly.
    #
    # 2. `env_file`, as a second net for variables a future upstream version
    #    reads that are not yet in the list below — worth having on a fork that
    #    rebases indefinitely. `required: false` makes it a no-op when the file
    #    is absent, and `environment` takes precedence over it, so the derived
    #    values below stay authoritative. Needs Compose 2.24 or newer.
    #
    # To verify what actually arrived, see README-Dokploy.md, "Proving the
    # environment reached the container".
    # ---------------------------------------------------------------------
    env_file:
      - path: .env
        required: false

    environment:
      # ---- fixed by this file: they describe its shape, not your preference ----
      - DEPLOYMENT_TYPE=docker
      # The slim target carries no PostgreSQL. Set so a misconfiguration fails
      # with "no database configured" rather than a confusing init error.
      - TYMESLOT_EMBEDDED_DB=false

      # ---- derived, and overridable by setting the same name in Dokploy ----
      # Built from the fixed user and database name, this project's postgres
      # service, and the one password you supply. Ecto parses it and merges it
      # over any discrete DATABASE_*/POSTGRES_* settings.
      - DATABASE_URL=${DATABASE_URL:-postgres://tymeslot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/tymeslot}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Tymeslot}
      - SMTP_PORT=${SMTP_PORT:-587}

      # ---- required: the deploy fails here rather than booting misconfigured ----
      # PHX_HOST must match the Host on Dokploy's Domains tab exactly. Phoenix
      # builds every absolute URL from it — booking links, email links, OAuth
      # redirect URIs — not from the incoming request.
      - PHX_HOST=${PHX_HOST:?PHX_HOST is required}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
      # SMTP_HOST is deliberately NOT required here: it is needed only when
      # EMAIL_ADAPTER selects smtp (the default). With mailgun, postmark,
      # sendgrid or ahasend there is no SMTP host at all, and requiring one
      # would block a perfectly valid configuration. It is passed through
      # below; when the SMTP adapter is in use and the host is missing, the
      # app refuses to boot with "SMTP host is required (set SMTP_HOST
      # environment variable)", which says the same thing at the right time.

      # ---- pass-through ----
      # Every remaining variable Tymeslot reads, extracted from the codebase.
      # Set any of them on Dokploy's Environment tab and it arrives; leave it
      # unset and it is absent from the container, exactly as the app expects.
      # Regenerate after a rebase — see README-Dokploy.md, "Keeping the
      # pass-through list current".
      # Database
      - DATABASE_HOST
      - DATABASE_POOL_SIZE
      - DATABASE_PORT
      - DATABASE_SSL
      - DATABASE_SSL_CACERT_FILE
      - POSTGRES_DB
      - POSTGRES_PASSWORD
      - POSTGRES_USER

      # Mail
      - AHASEND_ACCOUNT_ID
      - AHASEND_API_KEY
      - EMAIL_ADAPTER
      - EMAIL_CONTACT_RECIPIENT
      - EMAIL_SUPPORT_ADDRESS
      - MAILGUN_API_KEY
      - MAILGUN_BASE_URL
      - MAILGUN_DOMAIN
      - POSTMARK_API_KEY
      - SENDGRID_API_KEY
      - SMTP_CACERTFILE
      - SMTP_HOST
      - SMTP_PASSWORD
      - SMTP_SSL
      - SMTP_TLS_VERIFY
      - SMTP_USERNAME

      # Sign-in, registration and SSO
      - ENABLE_GITHUB_AUTH
      - ENABLE_GOOGLE_AUTH
      - ENABLE_OAUTH_AUTH
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - OAUTH_ALLOW_ID_FALLBACK
      - OAUTH_AUTHORIZE_URL
      - OAUTH_CLIENT_ID
      - OAUTH_CLIENT_SECRET
      - OAUTH_PROVIDER_URL
      - OAUTH_SCOPE
      - OAUTH_TOKEN_URL
      - OAUTH_USERINFO_URL
      - PASSWORD_AUTH_ENABLED
      - RECAPTCHA_BOOKING_ACTION
      - RECAPTCHA_BOOKING_ENABLED
      - RECAPTCHA_BOOKING_MIN_SCORE
      - RECAPTCHA_EXPECTED_HOSTNAMES
      - RECAPTCHA_SECRET_KEY
      - RECAPTCHA_SIGNUP_ACTION
      - RECAPTCHA_SIGNUP_ENABLED
      - RECAPTCHA_SIGNUP_MIN_SCORE
      - RECAPTCHA_SITE_KEY
      - REGISTRATION_ENABLED

      # Calendar and video providers
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_STATE_SECRET
      - MIROTALK_API_KEY
      - MIROTALK_BASE_URL
      - OUTLOOK_CLIENT_ID
      - OUTLOOK_CLIENT_SECRET
      - OUTLOOK_STATE_SECRET
      - SLACK_CLIENT_ID
      - SLACK_CLIENT_SECRET
      - SLACK_ENABLED
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_BOT_USERNAME
      - TELEGRAM_ENABLED
      - TELEGRAM_WEBHOOK_SECRET
      - ZOOM_CLIENT_ID
      - ZOOM_CLIENT_SECRET
      - ZOOM_DEAUTH_SECRET
      - ZOOM_STATE_SECRET
      - ZOOM_UPDATE_SCOPE_ENABLED

      # Payments
      - MEETING_PAYMENTS_APPLICATION_FEE_BP
      - MEETING_PAYMENTS_DEFAULT_COUNTRY
      - MEETING_PAYMENTS_ENABLED
      - STRIPE_CONNECT_WEBHOOK_SECRET
      - STRIPE_SECRET_KEY
      - STRIPE_WEBHOOK_SECRET

      # Networking and proxies
      - ALLOW_PRIVATE_IPS_FOR_CALENDAR
      - ALLOW_PRIVATE_IPS_FOR_VIDEO
      - ALLOW_PRIVATE_IPS_FOR_WEBHOOKS
      - DNS_CLUSTER_QUERY
      - HTTPS_PROXY
      - HTTP_PROXY
      - LISTEN_IP
      - NO_PROXY
      - PORT
      - TRUST_PRIVATE_CLIENT_IPS
      - URL_SCHEME
      - WEBHOOK_BASE_URL
      - WS_ALLOWED_ORIGINS

      # Everything else
      - ADMIN_ALERTS_ENABLED
      - ADMIN_ALERT_EMAIL
      - ANALYTICS_SALT_SECRET
      - DOCS_ARTICLE_BASE_URL

    # Migrations run on boot, so the database must be accepting connections
    # first. Without this the first deploy races and the container restarts.
    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - tymeslot_data:/app/data

    # dokploy-network is what Traefik routes over; internal is this project's
    # private link to postgres.
    networks:
      - dokploy-network
      - internal

  postgres:
    # Matches the version upstream's own docker-compose.with-postgres.yml uses.
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: tymeslot
      POSTGRES_USER: tymeslot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - tymeslot_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tymeslot -d tymeslot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    # Deliberately not on dokploy-network: the database is reachable only from
    # this project, never from Traefik or from other Dokploy applications.
    networks:
      - internal

# Left unnamed so Dokploy namespaces them per project. Upstream's compose files
# pin `name: tymeslot_data` and `name: tymeslot_pg`; colliding with those would
# hand postgres:17-alpine a cluster created by a different packaging, which it
# refuses to open.
volumes:
  tymeslot_data:
  tymeslot_pgdata:

networks:
  dokploy-network:
    external: true
  internal:
